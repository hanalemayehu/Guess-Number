<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess my number</title>
    <link rel="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-wrapper">
        <div id="first">
            <button type="button" name="button" class="btn again">Again!</button>
            <p class="between"> (Between 1 and 20) </p>
        </div>
        <h1 >Guess My Number</h1>
        <div class="number">
            <hr>
            ?</div>
    </header>
    <main>
        <section class="main-section">
            <input type="number" class="guess">
            <p class="text">Start guessing ...</p>
        </section>
        <section class="score-section">
            <div class="btn">
                <button type="button" name="button" class="btn check">Check!</button>
            </div>
            <div class="score-paragraph">
                <p>💯  Score: 20 <span class="score">20</span></p>
                <p>🥇  Highscore: 17<span class="highscore">0</span></p> 
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
